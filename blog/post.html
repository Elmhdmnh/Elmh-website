<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章 - Elmh 的博客</title>
    <link rel="icon" type="image/jpeg" href="../me.jpg">
    <link rel="stylesheet" href="blog-style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header class="site-header">
            <a class="logo" href="../blog.html">Elmh 的博客</a>
            <nav class="nav">
                <a href="../index.html">主页</a>
                <a href="../blog.html" class="active">博客</a>
            </nav>
        </header>

        <article id="article"></article>

        <footer class="site-footer">
            <span>© <span id="year">2025</span> Elmh</span>
            <a href="https://github.com/Elmhdmnh" target="_blank" rel="noopener noreferrer">GitHub</a>
        </footer>
    </div>

    <div class="lightbox" id="lightbox"><img id="lightboxImg" alt="放大图片"></div>

    <script>
    (function() {
        const article = document.getElementById('article');
        const params = new URLSearchParams(location.search);
        const slug = params.get('slug');
        const CAT = { tech: '技术笔记', game: '游戏杂谈', life: '学习生活' };

        function esc(s) {
            return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        function show404() {
            const local = location.protocol === 'file:';
            article.innerHTML = '<div class="post-404"><h2>' + (local ? '本地预览限制' : '文章不存在') + '</h2><p>' + (local ? '本地直接打开无法加载文章（浏览器安全限制），请用本地服务器预览或部署后访问' : '链接可能已失效') + '</p><a class="post-back" href="../blog.html">← 返回列表</a></div>';
        }

        if (!slug || typeof marked === 'undefined') { show404(); return; }

        fetch('posts/index.json')
            .then(r => r.json())
            .then(list => {
                const post = list.find(p => p.slug === slug);
                if (!post) { show404(); return; }
                document.title = post.title + ' · Elmh 的博客';
                return fetch('posts/' + post.file).then(r => r.text()).then(md => {
                    article.innerHTML = `
                        <header class="post-header">
                            <h1>${esc(post.title)}</h1>
                            <div class="post-meta">
                                <span>${esc(post.date)}</span>
                                <span>${esc(CAT[post.category] || post.category)}</span>
                            </div>
                        </header>
                        <div class="post-body">${marked.parse(md)}</div>
                        <a class="post-back" href="../blog.html">← 返回列表</a>`;
                });
            })
            .catch(show404);

        // 图片点击放大（灯箱）
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');
        article.addEventListener('click', (e) => {
            if (e.target.tagName === 'IMG') {
                lightboxImg.src = e.target.src;
                lightbox.classList.add('open');
            }
        });
        lightbox.addEventListener('click', () => lightbox.classList.remove('open'));
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') lightbox.classList.remove('open');
        });

        document.getElementById('year').textContent = new Date().getFullYear();
    })();
    </script>
</body>
</html>
