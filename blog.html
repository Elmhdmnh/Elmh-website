    </div>

    <script>
    (function() {
        // 分类筛选：文章列表已是静态 HTML，这里只做显示/隐藏（无 JS 时列表依然完整可见）
        const filter = document.getElementById('catFilter');
        const items = Array.from(document.querySelectorAll('.post-item'));
        let cat = 'all';

        function apply() {
            items.forEach(el => {
                el.style.display = (cat === 'all' || el.dataset.cat === cat) ? '' : 'none';
            });
        }

        filter.addEventListener('click', (e) => {
            const btn = e.target.closest('.cat-btn');
            if (!btn) return;
            cat = btn.dataset.cat;
            filter.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b === btn));
            apply();
        });

        document.getElementById('year').textContent = new Date().getFullYear();
    })();
    </script>
</body>
